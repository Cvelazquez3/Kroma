<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo gris carbón redondeado acorde a KROMA v2.0 -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0B0B0E" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="2.5"/>

  <!-- Tres estelas finas de inercia (Rojo, Azul, Amarillo) -->
  <rect x="20" y="47" width="20" height="4" rx="2" fill="#F23840" fill-opacity="0.82"/>
  <rect x="13" y="62" width="27" height="4" rx="2" fill="#3380FF" fill-opacity="0.82"/>
  <rect x="23" y="77" width="17" height="4" rx="2" fill="#FFD126" fill-opacity="0.82"/>

  <!-- Bloque Inercial Púrpura -->
  <rect x="48" y="34" width="60" height="60" rx="11" fill="#AD40F2"/>
  <rect x="52.5" y="38.5" width="51" height="51" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2"/>

  <!-- Rombo interior (glifo de púrpura) -->
  <polygon points="78,50 92,64 78,78 64,64" fill="#141418" fill-opacity="0.90"/>
</svg>
